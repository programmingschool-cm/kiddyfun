<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#10b981"/>
  <meta name="description" content="KiddyFun Code — A fun English programming language for kids. Write simple code, watch stories come alive, learn vocabulary and logic!"/>
  <title>KiddyFun Code — Learn Programming &amp; English</title>

  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <meta property="og:title" content="KiddyFun Code — by Programming School" />
  <meta property="og:description" content="A magically easy programming language for kids! Write simple English code, watch your story come alive." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://programmingschool-cm.github.io/kiddyfun/" />
  <meta property="og:image" content="https://placehold.co/1200x630/0f172a/eab308.png?text=KiddyFun+Code" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand kf-navbar fixed-top py-0">
    <div class="container-fluid px-2 px-md-3">
      <div class="d-flex align-items-center gap-2">
        <button class="kf-btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#leftMenu" aria-label="Open menu" title="Menu">
          <span class="fw-bold">☰</span>
        </button>
        <a class="navbar-brand m-0 d-flex align-items-center text-decoration-none" href="#">
          <svg width="34" height="34" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="me-2" aria-hidden="true">
            <circle cx="50" cy="50" r="46" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
            <path d="M30 75 V25 h22 c12 0, 20 8, 20 16 c0 12, -12 16, -20 16 h-8" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
            <path d="M68 25 v8 c0 0, -4 -8, -16 -8 H30" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
            <text x="52" y="52" font-family="monospace" font-size="16" font-weight="900" fill="#10b981" text-anchor="middle">&lt;/&gt;</text>
          </svg>
          <span class="kf-brand-text">KiddyFun Code</span>
        </a>
        <span class="d-none d-xl-inline text-muted small border-start ps-3 ms-1">by Programming School</span>
      </div>

      <div class="d-flex align-items-center gap-1 gap-md-2">
        <button class="kf-btn-icon d-none d-sm-flex" id="btn-toggle-voice" title="English Voice (Text-to-Speech)" aria-label="Toggle voice">
          🔊
        </button>
        <button class="kf-btn-icon d-none d-sm-flex" id="btn-toggle-sound" title="Sound Effects" aria-label="Toggle sound">
          🎵
        </button>
        <div class="dropdown">
          <button class="btn btn-light kf-pill-btn dropdown-toggle border shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            📚 Examples
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-3 mt-2 py-2" id="example-dropdown-menu" style="max-height: 70vh; overflow-y: auto;"></ul>
        </div>
        <button class="btn btn-outline-danger kf-pill-btn d-none d-md-inline-block" id="btn-reset-progress" title="Reset all progress">Reset</button>
      </div>
    </div>
  </nav>

  <!-- OFFCANVAS MENU -->
  <div class="offcanvas offcanvas-start border-0 shadow-lg" tabindex="-1" id="leftMenu" style="width: min(340px, 92vw);">
    <div class="offcanvas-header border-bottom py-3">
      <h5 class="offcanvas-title fw-bold m-0">📚 KiddyFun Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="kf-progress-wrap" id="kf-progress-wrap">
      <div class="kf-progress-label">
        <span>🎯 Mission Progress</span>
        <span id="kf-progress-text">0 / 5</span>
      </div>
      <div class="kf-progress-bar"><div class="kf-progress-fill" id="kf-progress-fill" style="width: 0%"></div></div>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
      <div class="ss-nav-panel">
        <button class="ss-nav-btn active" data-panel="guide">📖 Guide</button>
        <button class="ss-nav-btn" data-panel="missions">🎯 Missions</button>
        <button class="ss-nav-btn" data-panel="saved">💾 Saved</button>
      </div>
      <div class="ss-side-panel flex-grow-1">
        <div id="panel-guide"></div>
        <div id="panel-missions" class="d-none"></div>
        <div id="panel-saved" class="d-none"></div>
      </div>
      <div class="p-3 border-top d-flex gap-2 d-md-none">
        <button class="btn btn-outline-danger btn-sm flex-fill" id="btn-reset-progress-mobile">🔄 Reset Progress</button>
      </div>
    </div>
  </div>

  <!-- WORKSPACE -->
  <main class="kf-workspace" id="workspace">
    <!-- Mobile tab switcher -->
    <div class="d-flex d-lg-none kf-mobile-tabs" id="mobile-tabs">
      <button class="kf-tab-btn active" id="tab-code-btn">✏️ Code</button>
      <button class="kf-tab-btn" id="tab-output-btn">📺 Output</button>
    </div>

    <div class="row g-0 kf-main-row mx-0" id="main-row">
      <!-- CODE PANEL -->
      <div class="col-12 kf-col-code d-flex flex-column kf-col" id="code-col">
        <div class="kf-panel">
          <div class="kf-editor-toolbar">
            <span class="fw-bold d-flex align-items-center gap-2"><span class="text-warning">✏️</span> Your Code</span>
            <div class="d-flex gap-1">
              <button class="kf-toolbar-btn d-sm-none" id="btn-toggle-voice-mobile" title="Voice">🔊</button>
              <button class="kf-toolbar-btn d-sm-none" id="btn-toggle-sound-mobile" title="Sound">🎵</button>
              <button class="kf-toolbar-btn" id="btn-clear" title="Clear">🗑️ <span class="d-none d-md-inline">Clear</span></button>
              <button class="kf-toolbar-btn" id="btn-save" title="Save">💾 <span class="d-none d-md-inline">Save</span></button>
              <button class="kf-toolbar-btn d-none d-sm-inline-block" id="btn-download" title="Download">📥</button>
            </div>
          </div>

          <div class="kf-panel-body">
            <div class="kf-editor-wrap flex-grow-1">
              <div class="kf-line-numbers" id="ss-line-numbers" aria-hidden="true"></div>
              <textarea class="kf-editor" id="ss-editor" spellcheck="false" aria-label="Code editor"
                placeholder='scene "school"&#10;&#10;Rafi appears&#10;Rafi says "Hello!"&#10;Rafi waves'></textarea>
            </div>

            <div class="d-flex gap-2 mt-2">
              <button class="kf-btn-run flex-fill" id="btn-run">▶️ RUN</button>
              <button class="kf-btn-stop flex-fill d-none" id="btn-stop">⏹️ STOP</button>
            </div>

            <div class="kf-error-panel mt-2 d-none" id="ss-error-panel" role="alert"></div>
          </div>
        </div>
      </div>

      <!-- OUTPUT PANEL -->
      <div class="col-12 kf-col-output d-flex flex-column kf-col" id="output-col">
        <div class="kf-panel">
          <div class="kf-panel-header">
            <h2 class="kf-panel-title"><span>📺</span> Live Output</h2>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary kf-pill-btn d-none d-lg-inline-block" id="btn-toggle-code">🔲 Full Screen</button>
              <button class="btn btn-sm btn-light kf-pill-btn border" id="btn-reset">🔄 Reset</button>
            </div>
          </div>

          <div class="kf-panel-body">
            <div class="kf-stage-wrap flex-grow-1">
              <div class="ss-stage" id="ss-stage" role="img" aria-label="Story stage">
                <div class="kf-stage-particles" id="kf-particles" aria-hidden="true"></div>
                <div class="kf-voice-indicator" id="kf-voice-indicator" aria-live="polite">
                  <div class="kf-voice-bars"><span class="kf-voice-bar"></span><span class="kf-voice-bar"></span><span class="kf-voice-bar"></span></div>
                  Speaking English…
                </div>
              </div>
            </div>

            <div class="kf-bottom-grid mt-2">
              <div class="ss-log-panel" id="ss-log" aria-label="Program log"></div>
              <div class="kf-bottom-side d-flex flex-column gap-2">
                <div class="ss-score-panel" id="ss-score">🏆 Score: 0</div>
                <div class="ss-vocab-panel" id="ss-vocab" aria-label="Vocabulary cards"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Badge overlay -->
  <div class="ss-badge-overlay d-none" id="ss-badge-overlay" role="dialog" aria-modal="true">
    <div class="ss-badge-popup ss-anim-jump">
      <div class="ss-badge-text" id="ss-badge-text">🎉 Mission Complete!</div>
      <p class="text-muted mt-2 mb-0 small">Tap anywhere to close</p>
    </div>
  </div>

  <div id="ss-toast" class="ss-toast d-none" role="status" aria-live="polite">Saved!</div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/lexer.js"></script>
  <script src="assets/js/parser.js"></script>
  <script src="assets/js/errors.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/examples.js"></script>
  <script src="assets/js/missions.js"></script>
  <script src="assets/js/runtime.js"></script>
  <script src="assets/js/interpreter.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
